name: iOS Release Build
 
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      project:
        description: "Path to .xcodeproj (leave empty to auto-detect)"
        required: false
        default: ""
      scheme:
        description: "Xcode scheme (leave empty to auto-detect)"
        required: false
        default: ""
 
jobs:
  build:
    runs-on: macos-latest
    env:
      CONFIGURATION: Release
 
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
 
      - name: Show Xcode version
        run: xcodebuild -version
 
      - name: Install tools
        run: brew install cmake ninja || true
 
      # Only runs if your fork ships the OpenMP script.
      - name: Build OpenMP.xcframework (if present)
        run: |
          S=shell/apple/emulator-ios/OpenMP/build_ios_openmp.sh
          if [ -f "$S" ]; then "$S" --disableSimulator; else echo "No OpenMP script, skipping"; fi
 
      - name: Locate Xcode project
        id: proj
        run: |
          PROJ="${{ github.event.inputs.project }}"
          if [ -z "$PROJ" ]; then
            PROJ=$(find . -name "*.xcodeproj" -not -path "./deps/*" -not -path "*/.git/*" | head -n 1)
          fi
          if [ -z "$PROJ" ]; then
            echo "No .xcodeproj committed; generating one with CMake"
            cmake -S . -B build-xcode -G Xcode -DCMAKE_SYSTEM_NAME=iOS
            PROJ=$(find build-xcode -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          fi
          echo "Using project: $PROJ"
          echo "path=$PROJ" >> "$GITHUB_OUTPUT"
 
      - name: Pick scheme
        id: scheme
        run: |
          SCHEME="${{ github.event.inputs.scheme }}"
          if [ -z "$SCHEME" ]; then
            xcodebuild -list -json -project "${{ steps.proj.outputs.path }}" > schemes.json
            cat schemes.json
            SCHEME=$(python3 - << 'PY'
          import json
          d = json.load(open("schemes.json"))
          s = d.get("project", {}).get("schemes", [])
          pref = [x for x in s if x.lower() == "flycast"] or [x for x in s if "flycast" in x.lower() and "test" not in x.lower()] or s
          print(pref[0] if pref else "")
          PY
            )
          fi
          echo "Using scheme: $SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"
 
      - name: Build Release (unsigned, device SDK)
        run: |
          xcodebuild build \
            -project "${{ steps.proj.outputs.path }}" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee build.log | tail -n 100
 
      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products -type d -name "*.app" -path "*Release-iphoneos*" | head -n 1)
          if [ -z "$APP" ]; then echo "No .app found"; find build -name "*.app"; exit 1; fi
          echo "Packaging $APP"
          rm -rf Payload && mkdir -p Payload artifact
          cp -R "$APP" Payload/
          zip -qr artifact/Flycast-Release-unsigned.ipa Payload
 
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Flycast-iOS-Release-unsigned
          path: artifact/Flycast-Release-unsigned.ipa
 
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore